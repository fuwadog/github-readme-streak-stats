# Exceptional manual release path: reuse the normal verification gates while
# allowing an intentional release when no conventional commit was detected.
name: Force Release

on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    authorize:
        name: Authorize protected release
        runs-on: ubuntu-24.04
        permissions:
            contents: read
        steps:
            - name: Checkout requested ref
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  ref: ${{ github.sha }}

            - name: Verify protected ref and actor authorization
              env:
                  GH_TOKEN: ${{ github.token }}
                  EXPECTED_SHA: ${{ github.sha }}
              run: |
                  set -euo pipefail
                  test "$GITHUB_REF" = "refs/heads/main"
                  test "$GITHUB_REF_PROTECTED" = "true"
                  test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
                  permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" --jq .permission)"
                  case "$permission" in
                      admin|maintain) ;;
                      *)
                          echo "::error::actor $GITHUB_ACTOR is not authorized for force release"
                          exit 1
                          ;;
                  esac

    release:
        needs: authorize
        uses: ./.github/workflows/release.yml
        with:
            force-release: true
