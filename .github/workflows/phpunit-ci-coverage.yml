name: PHP CI

on:
    workflow_dispatch:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    build-test:
        name: PHP ${{ matrix.php-version }}
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                php-version: ["8.2.29", "8.3.23", "8.4.10"]
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Set up PHP
              uses: shivammathur/setup-php@c482204203a2eb89366ad513842766b70efaaee8 # v2
              with:
                  php-version: ${{ matrix.php-version }}
                  extensions: curl, intl, mbstring, dom, xml, xmlwriter
                  coverage: pcov

            - name: Verify PHP extensions
              run: |
                  php -m | grep -qx curl
                  php -m | grep -qx intl
                  php -m | grep -qx mbstring
                  php -m | grep -qx dom
                  php -m | grep -qx xml
                  php -m | grep -qx xmlwriter

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins

            - name: Validate and audit Composer dependencies
              run: |
                  composer validate --strict --no-check-publish
                  composer audit --locked --no-interaction

            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 24.7.0
                  cache: npm

            - name: Install formatter dependencies
              run: npm ci --ignore-scripts

            - name: Audit npm dependencies
              run: npm audit --audit-level=high

            - name: Run deterministic regression tests
              run: composer test

            - name: Check formatting
              run: composer lint

            - name: Run static analysis
              run: composer analyse

            - name: Run coverage regression check
              run: composer coverage

            - name: Record coverage provenance
              if: ${{ matrix.php-version == '8.4.10' }}
              run: |
                  {
                      printf 'repository=%s\n' "$GITHUB_REPOSITORY"
                      printf 'commit=%s\n' "$GITHUB_SHA"
                      printf 'workflow=%s\n' "$GITHUB_WORKFLOW"
                      sha256sum coverage.xml
                  } > coverage.provenance

            - name: Upload coverage report
              if: ${{ matrix.php-version == '8.4.10' }}
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: phpunit-coverage
                  path: |
                      coverage.xml
                      coverage.provenance
                  if-no-files-found: error

    container-health:
        name: Container bootstrap and health check
        runs-on: ubuntu-24.04
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Lint GitHub Actions workflows
              run: |
                  set -euo pipefail
                  docker run --rm --entrypoint /bin/sh \
                      --volume "$GITHUB_WORKSPACE:/repo:ro" \
                      docker.io/rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
                      -c 'actionlint /repo/.github/workflows/*.yml'

            - name: Verify Vercel function and renderer isolation contracts
              run: |
                  set -euo pipefail
                  jq -e '
                      (.routes[-1].handle == "filesystem") and
                      (.functions | (type == "object" and length == 1 and .["api/index.php"].runtime == "vercel-php@0.7.4")) and
                      ([.routes[] | select(.src == "/api/.*\\.php(?:/.*)?$") | .status] == [404]) and
                      ([.routes[] | select(.src == "/$") | .dest] == ["/api/index.php?__route=api"]) and
                      ([.routes[] | select(.src == "/demo/?$") | .dest] == ["/api/index.php?__route=demo-index"]) and
                      ([.routes[] | select(.src == "/demo/(.+)$") | .dest] == ["/api/index.php?__route=demo-static&__demo_path=$1"]) and
                      ([.routes[] | select(.src == "/demo/preview\\.php(?:/.*)?$") | .dest] == ["/api/index.php?__route=demo-preview"])
                  ' vercel.json >/dev/null

                  docker compose --profile test config --format json > /tmp/streak-compose.json
                  jq -e '
                      .services.renderer.network_mode == "none" and
                      .services.renderer.read_only == true and
                      ((.services.renderer.ports // []) | length == 0) and
                      ((.services.renderer.cap_drop // []) | index("ALL") != null) and
                      ((.services.renderer.security_opt // []) | index("no-new-privileges:true") != null) and
                      .services["renderer-tests"].network_mode == "none" and
                      .services["renderer-tests"].read_only == true and
                      ((.services["renderer-tests"].ports // []) | length == 0) and
                      ((.services["renderer-tests"].cap_drop // []) | index("ALL") != null) and
                      ((.services["renderer-tests"].security_opt // []) | index("no-new-privileges:true") != null)
                  ' /tmp/streak-compose.json >/dev/null
                  ! grep -Eq '^[[:space:]]*EXPOSE[[:space:]]' renderer/Dockerfile

            - name: Build non-deployed verification target
              id: build-verification
              run: docker build --pull --target verification --tag streak-stats-verification .

            - name: Scan verification image with Trivy
              if: ${{ !cancelled() && steps.build-verification.outcome == 'success' }}
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  version: v0.70.0
                  scan-type: image
                  image-ref: streak-stats-verification
                  scanners: vuln
                  vuln-type: os,library
                  severity: HIGH,CRITICAL
                  ignore-unfixed: false
                  ignorefile: /dev/null
                  exit-code: 1
                  format: table
                  output: trivy-verification.txt
                  cache: true

            - name: Append verification image scan summary
              if: ${{ !cancelled() }}
              run: |
                  {
                      printf '### Trivy verification image scan\n\n'
                      if [ -f trivy-verification.txt ]; then
                          cat trivy-verification.txt
                      elif [ "${{ steps.build-verification.outcome }}" != "success" ]; then
                          printf 'Scan unavailable: verification image build did not succeed.\n'
                      else
                          printf 'Scan unavailable: Trivy did not produce output after a successful image build.\n'
                      fi
                      printf '\n'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Run renderer unit tests
              run: docker compose --profile test run --rm renderer-tests

            - name: Build renderer image
              id: build-renderer
              if: ${{ !cancelled() }}
              run: docker buildx build --load --metadata-file renderer-build-metadata.json --pull --file renderer/Dockerfile --target production --tag streak-stats-renderer .

            - name: Scan renderer image with Trivy
              if: ${{ !cancelled() && steps.build-renderer.outcome == 'success' }}
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  version: v0.70.0
                  scan-type: image
                  image-ref: streak-stats-renderer
                  scanners: vuln
                  vuln-type: os,library
                  severity: HIGH,CRITICAL
                  ignore-unfixed: false
                  trivyignores: .trivyignore
                  exit-code: 1
                  format: table
                  output: trivy-renderer.txt
                  cache: true

            - name: Record unignored renderer Trivy evidence
              if: ${{ !cancelled() && steps.build-renderer.outcome == 'success' }}
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  version: v0.70.0
                  scan-type: image
                  image-ref: streak-stats-renderer
                  scanners: vuln
                  vuln-type: os,library
                  severity: HIGH,CRITICAL
                  ignore-unfixed: false
                  trivyignores: /dev/null
                  exit-code: 0
                  format: json
                  output: trivy-renderer-unignored.txt
                  cache: true

            - name: Generate renderer Trivy evidence provenance
              if: ${{ !cancelled() && steps.build-renderer.outcome == 'success' }}
              run: |
                  set -euo pipefail
                  test -s trivy-renderer-unignored.txt
                  test -s .trivyignore
                  image_digest="$(jq -r '."containerimage.digest" // empty' renderer-build-metadata.json)"
                  if [[ ! "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                      printf 'Renderer OCI manifest digest is unavailable or malformed.\n' >&2
                      exit 1
                  fi
                  trivyignore_sha256="$(sha256sum .trivyignore | awk '{print $1}')"
                  {
                      printf 'repository=%s\n' "$GITHUB_REPOSITORY"
                      printf 'commit=%s\n' "$GITHUB_SHA"
                      printf 'workflow=%s\n' "$GITHUB_WORKFLOW"
                      printf 'run_id=%s\n' "$GITHUB_RUN_ID"
                      printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
                      printf 'image_digest=%s\n' "$image_digest"
                      printf 'trivy_version=%s\n' 'v0.70.0'
                      printf 'scan_mode=%s\n' 'image,vuln,os,library,HIGH,CRITICAL,ignore-unfixed=false,unignored'
                      printf 'trivyignore_sha256=%s\n' "$trivyignore_sha256"
                  } > trivy-renderer-unignored.provenance
                  test -s trivy-renderer-unignored.provenance

            - name: Append renderer image scan summary
              if: ${{ !cancelled() }}
              run: |
                  {
                      printf '### Trivy renderer image scan\n\n'
                      if [ -f trivy-renderer.txt ]; then
                          cat trivy-renderer.txt
                      elif [ "${{ steps.build-renderer.outcome }}" != "success" ]; then
                          printf 'Scan unavailable: renderer image build did not succeed.\n'
                      else
                          printf 'Scan unavailable: Trivy did not produce output after a successful image build.\n'
                      fi
                      printf '\n'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Build production image
              id: build-production
              if: ${{ !cancelled() }}
              run: |
                  set -euo pipefail
                  docker build --pull --tag streak-stats-ci .

            - name: Health-check production container
              id: production-readiness
              if: ${{ !cancelled() && steps.build-production.outcome == 'success' }}
              run: |
                  set -euo pipefail
                  # shellcheck disable=SC2317 # cleanup runs indirectly via the EXIT trap
                  cleanup() {
                      local original_exit_code=$?
                      if docker rm --force streak-stats-ci >/dev/null 2>&1; then
                          printf 'Production container cleanup succeeded.\n'
                      else
                          printf 'Failed to remove production container streak-stats-ci.\n' >&2
                          if [ "$original_exit_code" -eq 0 ]; then
                              exit 1
                          fi
                      fi
                      exit "$original_exit_code"
                  }
                  trap cleanup EXIT
                  docker run --detach --name streak-stats-ci --publish 8080:80 streak-stats-ci
                  for attempt in $(seq 1 30); do
                      : "$attempt"
                      health="$(docker inspect --format '{{.State.Health.Status}}' streak-stats-ci)"
                      if [ "$health" = healthy ]; then
                          curl --fail --silent --show-error http://127.0.0.1:8080/demo/ >/dev/null
                          exit 0
                      fi
                      if [ "$health" = unhealthy ] || [ "$(docker inspect --format '{{.State.Status}}' streak-stats-ci)" = exited ]; then
                          docker logs streak-stats-ci
                          exit 1
                      fi
                      sleep 2
                  done
                  docker logs streak-stats-ci
                  exit 1

            - name: Scan production image with Trivy
              if: ${{ !cancelled() && steps.build-production.outcome == 'success' && steps.production-readiness.outcome == 'success' }}
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  version: v0.70.0
                  scan-type: image
                  image-ref: streak-stats-ci
                  scanners: vuln
                  vuln-type: os,library
                  severity: HIGH,CRITICAL
                  ignore-unfixed: false
                  ignorefile: /dev/null
                  exit-code: 1
                  format: table
                  output: trivy-production.txt
                  cache: true

            - name: Append production image scan summary
              if: ${{ !cancelled() }}
              run: |
                  {
                      printf '### Trivy production image scan\n\n'
                      if [ -f trivy-production.txt ]; then
                          cat trivy-production.txt
                      elif [ "${{ steps.build-production.outcome }}" != "success" ]; then
                          printf 'Scan unavailable: production image build did not succeed.\n'
                      elif [ "${{ steps.production-readiness.outcome }}" != "success" ]; then
                          printf 'Scan skipped: production readiness health check did not pass.\n'
                      else
                          printf 'Scan unavailable: Trivy did not produce output after a successful image build.\n'
                      fi
                      printf '\n'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Upload Trivy reports
              if: ${{ always() && !cancelled() }}
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: trivy-reports
                  path: |
                      trivy-verification.txt
                      trivy-renderer.txt
                      trivy-renderer-unignored.txt
                      trivy-renderer-unignored.provenance
                      trivy-production.txt
                  if-no-files-found: warn

            - name: Upload required renderer Trivy evidence
              if: ${{ always() && !cancelled() && steps.build-renderer.outcome == 'success' }}
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: trivy-renderer-unignored-evidence
                  path: |
                      trivy-renderer-unignored.txt
                      trivy-renderer-unignored.provenance
                  if-no-files-found: error
