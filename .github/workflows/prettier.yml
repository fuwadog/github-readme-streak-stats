name: Format with Prettier

on:
    push:
        branches:
            - main
    pull_request:
        paths:
            - "**.php"
            - "**.md"
            - "**.js"
            - "**.css"
            - "package.json"
            - "package-lock.json"
            - ".prettierrc.js"
            - ".prettierignore"
            - ".editorconfig"
            - ".github/workflows/prettier.yml"

permissions:
    contents: read

jobs:
    prettier:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 24.20.0
                  cache: npm

            - name: Install locked formatter dependencies
              run: npm ci --ignore-scripts

            - name: Check formatting
              run: npx --no-install prettier --check "**/*.{php,md,js,css}"

            - name: Check demo PHP and accessibility contracts
              run: |
                  set -euo pipefail
                  php -l api/demo/index.php
                  php -l api/demo/preview.php
                  php -l api/demo/vercel-static.php
                  grep -Eq '<html lang="[^"]+"' api/demo/index.php
                  grep -Fq '<title>' api/demo/index.php
                  grep -Fq 'aria-label=' api/demo/index.php
                  grep -Fq 'alt="' api/demo/index.php
