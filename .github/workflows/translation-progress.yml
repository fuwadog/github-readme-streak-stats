name: Update Translation Progress

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - "api/translations.php"
            - "scripts/translation-progress.php"
            - ".github/workflows/translation-progress.yml"
            - "README.md"

permissions:
    contents: read

concurrency:
    group: translation-progress-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Set up PHP
              uses: shivammathur/setup-php@c482204203a2eb89366ad513842766b70efaaee8 # v2
              with:
                  php-version: 8.2
                  extensions: curl, intl

            - name: Install locked dependencies
              run: composer install --no-dev --no-interaction --prefer-dist --no-progress

            - name: Generate translation progress
              run: php -d date.timezone=UTC scripts/translation-progress.php

            - name: Validate generated README
              run: git diff --exit-code -- README.md
